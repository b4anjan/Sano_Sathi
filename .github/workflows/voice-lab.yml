# Voice lab: makes a few sample lines with different voice settings so they can be compared
# (Azure AI Speech; or round "cloud": ElevenLabs, OpenAI and Google Gemini, each run only if its
#  secret is set: ELEVENLABS_API_KEY, OPENAI_API_KEY, GEMINI_API_KEY)
# before every clip is remade. Results go to the "voice-lab" branch (not to the website).
#   GitHub > Actions > "Voice lab" > Run workflow.
name: Voice lab

on:
  workflow_dispatch:
    inputs:
      voices:
        description: Multilingual voices to try (comma separated full names), or empty for a default set
        type: string
        default: ''
      round:
        description: Which test (empty = voices; "letters" = single Nepali letters; "female" = female voices with the I4 recipe; "cloud" = ElevenLabs, OpenAI and Google, whichever keys are set)
        type: string
        default: ''

permissions:
  contents: write

jobs:
  lab:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - name: Make sure ffmpeg is installed
        run: command -v ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
      - name: Make the samples
        env:
          AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
          AZURE_SPEECH_REGION: ${{ secrets.AZURE_SPEECH_REGION }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          LAB_VOICES: ${{ inputs.voices }}
          LAB_ROUND: ${{ inputs.round }}
        run: |
          if [ "$LAB_ROUND" = "cloud" ]; then node scripts/voice-lab-cloud.mjs && node scripts/voice-lab-clean.mjs; else node scripts/voice-lab.mjs; fi
      - name: Publish them to the voice-lab branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -q --orphan voice-lab
          git rm -rq --cached . >/dev/null
          git add lab
          git commit -q -m "Voice lab samples"
          git push -q -f origin voice-lab
